name: search-loop (reusable)

# Called by each selling site:
#   uses: seq23/search-loop/.github/workflows/search-loop.yml@v1
# The engine runs at the same ref (input engine_ref, default v1). It reads the
# global switch (control/mode.json, mirrored from the SEARCH_LOOP_MODE
# repository variable) itself; the site config may only lower it.
on:
  workflow_call:
    inputs:
      config:
        description: Path of the site's search-loop.config.json
        type: string
        default: search-loop.config.json
      stage:
        description: auto | find | build | check | report | validate (config + model routing only, no network; for pull_request)
        type: string
        default: auto
      engine_ref:
        description: Engine version to run (keep equal to the @ref in `uses:`)
        type: string
        default: v1
      setup_command:
        description: Optional site setup before the engine (e.g. npm ci --ignore-scripts)
        type: string
        default: ""
      post_build_command:
        description: Optional site finishing step (header, styles, sitemaps); runs after any run that wrote, rewrote or removed a site file
        type: string
        default: ""
      commit_command:
        description: Optional site commit helper; default commits the ledger, the pages and the pages it linked from, then pushes
        type: string
        default: ""
      node_options:
        description: Optional NODE_OPTIONS for the site's own build (e.g. --max-old-space-size=3072)
        type: string
        default: ""
      commit_message:
        type: string
        default: "search loop: daily pages, checks and ledger"
      open_loops_business:
        description: The Boss OS brain slug this site's Open Loops rows belong to
        type: string
        default: spry
      gsc_site_secret:
        description: Environment secret holding the Search Console property
        type: string
        default: GSC_SITE_URL
      cloudflare_read_secret:
        description: Environment secret holding the Cloudflare analytics token
        type: string
        default: SEARCH_LOOP_CF_USAGE_TOKEN
    secrets:
      SEARCH_LOOP_CF_ACCOUNT_ID:
        required: false
      SEARCH_LOOP_CF_WORKERS_AI_TOKEN:
        required: false
      SEARCH_LOOP_GEMINI_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      GSC_SERVICE_ACCOUNT_JSON:
        required: false
      GSC_SITE_URL:
        required: false
      BING_WEBMASTER_API_KEY:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_WORKERS_AI_TOKEN:
        required: false
      GEMINI_API_KEY:
        required: false
      INDEXNOW_KEY:
        required: false
      # v1.6.0: optional top-10 read for the can-be-#1 lane (Brave Search API, free credit only).
      BRAVE_SEARCH_API_KEY:
        required: false
      # v1.7.0: the run's named stops become Boss OS Open Loops rows (boss-os docs/open-loops.md).
      BOSS_OPEN_LOOPS_TOKEN:
        required: false
    outputs:
      mode:
        value: ${{ jobs.loop.outputs.mode }}
      published:
        value: ${{ jobs.loop.outputs.published }}

jobs:
  # stage: validate — config and model-routing checks only (the run's own CONFIG_INVALID /
  # FAIL_LOUD messages), no network, no model call. A caller runs it on pull_request with a
  # paths filter, so a broken search-loop.config.json or routing file is red before merge.
  validate:
    if: inputs.stage == 'validate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: seq23/search-loop
          ref: ${{ inputs.engine_ref }}
          path: .search-loop-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Site setup
        if: inputs.setup_command != ''
        run: ${{ inputs.setup_command }}
      - name: Validate the site config and model routing
        run: node .search-loop-engine/bin/search-loop.mjs validate-config --config "${{ inputs.config }}"
  loop:
    if: inputs.stage != 'validate' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target'
    environment: reviewed-main
    runs-on: ubuntu-latest
    # ~4x a normal run (20 min) after the scheduled stagger (0-39 min). The engine's own
    # soft budget (35 min) and watchdog (55 min, NAMED STOP [RUN_HUNG]) end first.
    timeout-minutes: 100
    outputs:
      mode: ${{ steps.engine.outputs.mode }}
      published: ${{ steps.engine.outputs.published }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets[inputs.gsc_site_secret] || secrets.GSC_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets[inputs.cloudflare_read_secret] || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SEARCH_LOOP_CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.SEARCH_LOOP_CF_WORKERS_AI_TOKEN || secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.SEARCH_LOOP_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      NODE_OPTIONS: ${{ inputs.node_options }}
      # Validate-only pull requests use the separate credential-free job above.
      PUBLISH: ${{ github.ref_name == github.event.repository.default_branch && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: seq23/search-loop
          ref: ${{ inputs.engine_ref }}
          path: .search-loop-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Name any missing secret (a note; the run keeps going and stays green)
        run: |
          # A missing secret is a NAMED NOTE, never a red run: the stages that need it
          # write 'not read' (also in the weekly report) and the next run retries.
          for s in OPENROUTER_API_KEY GSC_SERVICE_ACCOUNT_JSON GSC_SITE_URL; do
            if [ -z "${!s}" ]; then echo "NAMED NOTE [SECRET_MISSING_$s] the reviewed-main environment has no value for $s; the stages that need it write 'not read' and the rest run." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Site setup
        if: inputs.setup_command != ''
        run: ${{ inputs.setup_command }}
      - name: Validate the site config and model routing
        run: node .search-loop-engine/bin/search-loop.mjs validate-config --config "${{ inputs.config }}"
      - name: Run the search loop
        id: engine
        env:
          # v1.14.0: reads this site's AI answer misses from Boss OS (read only). This step
          # only, never the site's own setup or build commands. Not passed -> "could not tell".
          BOSS_OPEN_LOOPS_TOKEN: ${{ secrets.BOSS_OPEN_LOOPS_TOKEN }}
        run: |
          set +e
          node .search-loop-engine/bin/search-loop.mjs run --config "${{ inputs.config }}" --stage "${{ inputs.stage }}" --github-output 2>&1 | tee .search-loop-run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "### search-loop" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(search-loop |note: |NAMED )' .search-loop-run.log >> "$GITHUB_STEP_SUMMARY" || true
          exit 0
      # The site's finishing step (header, styles, sitemap) runs after ANY run that wrote, rewrote
      # or removed a site file (pages_written > 0; "unknown", or missing from an engine older than
      # v1.17.2, also runs it), not only after a new page. mode is empty only when the engine wrote
      # no outputs at all (crashed or hung), and then nothing is committed either. Before this it ran
      # only after a new page: porchandparty901.com shipped 3 strengthened pages with no header or
      # styles when it ran on new pages only (27 Nov 2026). If it fails, nothing is committed and the
      # run is red with NAMED STOP [POST_BUILD_FAILED] (also an Open Loops row).
      - name: Site finishing step for pages this run wrote or rewrote
        id: post_build
        if: inputs.post_build_command != '' && steps.engine.outputs.mode != '' && steps.engine.outputs.pages_written != '0'
        env:
          POST_BUILD_COMMAND: ${{ inputs.post_build_command }}
          PAGES_WRITTEN: ${{ steps.engine.outputs.pages_written }}
        run: |
          echo "search-loop: site finishing step for pages_written=$PAGES_WRITTEN: $POST_BUILD_COMMAND"
          set +e
          bash -eo pipefail -c "$POST_BUILD_COMMAND"
          code=$?
          if [ "$code" -ne 0 ]; then
            line="NAMED STOP [POST_BUILD_FAILED] the site's finishing step (post_build_command) exited $code after this run wrote $PAGES_WRITTEN site file(s); nothing from this run is committed, so no page goes live without the site's header and styles. The next run retries."
            echo "$line" | tee -a .search-loop-run.log >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$line"
            exit 1
          fi
      - name: Commit and push (default branch only)
        if: env.PUBLISH == 'true' && steps.post_build.outcome != 'failure' && steps.engine.outputs.exit_code != '1' && steps.engine.outputs.exit_code != '9'
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          COMMIT_COMMAND: ${{ inputs.commit_command }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$COMMIT_COMMAND" ]; then bash -c "$COMMIT_COMMAND"; exit $?; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fetch + rebase onto the moved default branch and retry with jitter; the ledger merges, any other conflict is PUSH_CONFLICT.
          node .search-loop-engine/bin/commit-push.mjs --branch "${{ github.event.repository.default_branch }}" --message "$COMMIT_MESSAGE" --ledger-dir "${{ steps.engine.outputs.ledger_dir }}" --attempts 5
      - name: Upload the weekly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-loop-week
          path: ${{ steps.engine.outputs.report || 'search-loop-week.json' }}
          if-no-files-found: error
          overwrite: true
      - name: Upload the pages (proof runs)
        if: always() && env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: search-loop-pages
          path: |
            ${{ steps.engine.outputs.pages_dir }}
            ${{ steps.engine.outputs.ledger_dir }}/pages.json
            ${{ steps.engine.outputs.ledger_dir }}/drafts/**
          if-no-files-found: ignore
      - name: Report named stops to Open Loops (default branch; never fails the run)
        if: always() && env.PUBLISH == 'true'
        continue-on-error: true
        env:
          BOSS_OPEN_LOOPS_TOKEN: ${{ secrets.BOSS_OPEN_LOOPS_TOKEN }}
        run: |
          code="${{ steps.engine.outputs.exit_code }}"
          [ -n "$code" ] || echo "NAMED STOP [ENGINE_DID_NOT_RUN] the engine step produced no exit code" >> .search-loop-run.log
          node .search-loop-engine/bin/report-stops.mjs --log .search-loop-run.log --repo "${{ github.repository }}" --business "${{ inputs.open_loops_business }}"
      - name: Engine exit
        if: always()
        run: |
          code="${{ steps.engine.outputs.exit_code }}"
          [ -n "$code" ] || { echo "NAMED STOP [ENGINE_DID_NOT_RUN] the engine step produced no exit code" >&2; exit 9; }
          exit "$code"
